name: 'swift-package-xcode-select'
description: 'Select xcode version'
author: 'capturecontext'

branding:
  icon: 'archive'
  color: 'gray-dark'

inputs:
  version:
    description: Xcode version
    required: false
    default: '26.2'

runs:
  using: 'composite'
  steps:
  - id: select-xcode
    name: Select Xcode ${{ inputs.version }}
    if: inputs.version != '__unspecified__'
    shell: bash
    run: |
      # select-xcode step

      echo "xcode-select GITHUB_ACTION_PATH: $GITHUB_ACTION_PATH"
      make select-xcode \
        -f "$GITHUB_ACTION_PATH"/Makefile \
        VERSION=${{ inputs.version }} 
