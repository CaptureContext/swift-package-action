name: 'swift-package-build'
description: "Set of utils for CI of multiplatform swift packages"
author: 'capturecontext'
branding:
  icon: 'package'
  color: 'gray-dark'
inputs:
  xcode:
    description: Xcode version
    required: false
    default: '26.2'
  cache-derived-data:
    description: "Specifies if DerivedData should be cached"
    required: false
    default: false
  cache-derived-data-base-path:
    description: "Base path for DerivedData caching"
    required: false
    default: ~/.derivedData
  cache-derived-data-prefix:
    description: "Prefix for caching key"
    required: false
    default: __unspecified__
  cache-derived-data-suffix:
    description: "Suffix for caching key, likely to be files hash"
    required: false
    default: __unspecified__
  action:
    description: "Target action to run"
    required: false
    default: "xcodebuild"
  workspace:
    description: "Path to xcworkspace for xcodebuild actions"
    required: false
    default: .swiftpm/xcode/package.xcworkspace
  scheme:
    description: "Scheme"
    required: false
    default: __unspecified__
  platform:
    description: "Platform"
    required: false
    default: __unspecified__
  config:
    description: "Config"
    required: false
    default: Debug
  beautify:
    description: "Beautify"
    required: false
    default: quiet
  working-directory:
    description: "Where to run the action"
    required: false
    default: '.'
runs:
  using: "composite"
  steps:
    - name: Setup venv
      uses: capturecontext/swift-package-action/setup-venv@3.0-beta.8
    - name: Select Xcode ${{ inputs.xcode }}
      uses: capturecontext/swift-package-action/xcode-select@3.0-beta.8
      with:
        version: ${{ inputs.xcode }}
    - name: Install visionOS runtime
      if: inputs.platform == 'visionOS'
      uses: capturecontext/swift-package-action/install-visionos@3.0-beta.8
    - name: List available devices
      if: inputs.platform != '__unspecified__'
      shell: bash
      run: xcrun simctl list devices available
    - name: Cache derived data
      if: inputs.cache-derived-data == true
      uses: capturecontext/swift-package-action/cache/derived-data@3.0-beta.8
      with:
        path: ${{ inputs.cache-derived-data-base-path }}
        prefix: ${{ inputs.cache-derived-data-prefix }}
        platform: ${{ inputs.platform }}
        xcode: ${{ inputs.xcode }}
        command: ${{ inputs.action }}
        suffix: ${{ inputs.suffix }}
    - name: Set IgnoreFileSystemDeviceInodeChanges flag
      shell: bash
      run: defaults write com.apple.dt.XCBuild IgnoreFileSystemDeviceInodeChanges -bool YES
    - name: Update mtime for incremental builds
      uses: chetan/git-restore-mtime-action@v2
    - name: Run ${{ inputs.action }}
      shell: bash
      run: |
        echo "build GITHUB_ACTION_PATH: $GITHUB_ACTION_PATH"
        cd "${{ inputs.working-directory }}"
        make ${{ inputs.action }} \
          -f "$GITHUB_ACTION_PATH"/Makefile \
          ACTION_PATH="$GITHUB_ACTION_PATH" \
          WORKSPACE="${{ inputs.workspace }}" \
          COMMAND="${{ inputs.action }}" \
          SCHEME="${{ inputs.scheme }}" \
          PLATFORM="${{ inputs.platform }}" \
          CONFIG="${{ inputs.config }}" \
          BEAUTIFY="${{ inputs.beautify }}"
