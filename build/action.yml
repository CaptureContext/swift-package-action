name: 'swift-package-build'
description: "Set of utils for CI of multiplatform swift packages"
author: 'capturecontext'
branding:
  icon: 'package'
  color: 'gray-dark'
inputs:
  xcode:
    description: Xcode version
    required: false
    default: '26.2'
  cache-derived-data:
    description: "Specifies if DerivedData should be cached"
    required: false
    default: false
  cache-derived-data-path:
    description: "Path for DerivedData caching"
    required: false
    default: ~/.derivedData
  cache-derived-data-prefix:
    description: "Prefix for caching key"
    required: false
    default: __unspecified__
  cache-derived-data-suffix:
    description: "Suffix for caching key, files hash is used by default"
    required: false
    default: __unspecified__
  action:
    description: "Target action to run"
    required: false
    default: "xcodebuild"
  workspace:
    description: "Path to xcworkspace for xcodebuild actions"
    required: false
    default: .swiftpm/xcode/package.xcworkspace
  scheme:
    description: "Scheme"
    required: false
    default: __unspecified__
  platform:
    description: "Platform"
    required: false
    default: __unspecified__
  config:
    description: "Config"
    required: false
    default: Debug
  beautify:
    description: "Beautify"
    required: false
    default: quiet
  working-directory:
    description: "Where to run the action"
    required: false
    default: '.'
runs:
  using: "composite"
  steps:
    - id: print-action-path
      name: Print GITHUB_ACTION_PATH
      uses: capturecontext/swift-package-action/print-action-path@main
      with:
        name: "swift-package-build"
        path: ${{ env.GITHUB_ACTION_PATH }}

    - id: setup-venv
      name: Setup venv
      uses: capturecontext/swift-package-action/setup-venv@main

    - id: select-xcode
      name: Select Xcode ${{ inputs.xcode }}
      uses: capturecontext/swift-package-action/xcode-select@main
      with:
        version: ${{ inputs.xcode }}

    - id: install-visionos
      name: Install visionOS runtime
      if: inputs.platform == 'visionOS'
      uses: capturecontext/swift-package-action/install-visionos@main

    - id: cache-derived-data
      name: Cache derived data
      if: inputs.cache-derived-data == 'true'
      uses: capturecontext/swift-package-action/cache/derived-data@main
      with:
        path: ${{ inputs.cache-derived-data-path }}
        prefix: ${{ inputs.cache-derived-data-prefix }}
        platform: ${{ inputs.platform }}
        xcode: ${{ inputs.xcode }}
        command: ${{ inputs.action }}
        suffix: ${{ inputs.suffix }}

    - id: set-ignore-fs-device-inode-changes
      name: Set IgnoreFileSystemDeviceInodeChanges flag
      shell: bash
      run: defaults write com.apple.dt.XCBuild IgnoreFileSystemDeviceInodeChanges -bool YES

    - id: git-restore-mtime
      name: Update mtime for incremental builds
      uses: chetan/git-restore-mtime-action@v2

    - id: run-action
      name: Run ${{ inputs.action }}
      shell: bash
      run: |
        # run-action step

        cd "${{ inputs.working-directory }}"
        make ${{ inputs.action }} \
          -f "$GITHUB_ACTION_PATH"/Makefile \
          ACTION_PATH="$GITHUB_ACTION_PATH" \
          WORKSPACE="${{ inputs.workspace }}" \
          COMMAND="${{ inputs.action }}" \
          SCHEME="${{ inputs.scheme }}" \
          PLATFORM="${{ inputs.platform }}" \
          CONFIG="${{ inputs.config }}" \
          BEAUTIFY="${{ inputs.beautify }}" \
          DERIVED_DATA_PATH="${{ inputs.cache-derived-data-path }}"
