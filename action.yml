name: 'swift-package'
description: "Set of utils for CI of multiplatform swift packages"
author: 'capturecontext'
inputs:
  xcode:
    description: Xcode version
    required: false
    default: '16.2'
  cache-derived-data:
    description: "Specifies if DerivedData should be cached"
    required: false
    default: 'false'
  command:
    description: "MAKE command to run"
    required: true
  subcommand:
    description: "COMMAND argument for make action"
    required: false
    default: ''
  workspace:
    description: "Path to xcworkspace for xcodebuild actions"
    required: false
    default: '.swiftpm/xcode/package.xcworkspace'
  scheme:
    description: "Scheme"
    required: false
    default: '__unspecified__'
  platform:
    description: "Platform"
    required: false
    default: '__unspecified__'
  config:
    description: "Config"
    required: false
    default: "Debug"
  beautify:
    description: "Beautify"
    required: false
    default: 'quiet'
  working-directory:
    description: "Where to run the action"
    required: false
    default: '.'
branding:
  icon: 'package'
  color: 'gray-dark'
runs:
  using: "composite"
  steps:
    - name: Select Xcode ${{ inputs.xcode }}
      run: sudo xcode-select -s /Applications/Xcode_${{ inputs.xcode }}.app
    - name: Install visionOS runtime
      if: inputs.platform == 'visionOS'
      run: |
        sudo xcodebuild -runFirstLaunch
        sudo xcrun simctl list
        sudo xcodebuild -downloadPlatform visionOS
        sudo xcodebuild -runFirstLaunch
    - name: List available devices
      run: xcrun simctl list devices available
    - name: Cache derived data
      if: inputs.cache-derived-data == 'true'
      uses: actions/cache@v3
      with:
        path: |
          ~/.derivedData
        key: |
          deriveddata-xcodebuild-${{ inputs.platform }}-${{ inputs.xcode }}-${{ inputs.subcommand }}-${{ hashFiles('**/Sources/**/*.swift', '**/Tests/**/*.swift') }}
        restore-keys: |
          deriveddata-xcodebuild-${{ inputs.platform }}-${{ inputs.xcode }}-${{ inputs.subcommand }}-
    - name: Set IgnoreFileSystemDeviceInodeChanges flag
      run: defaults write com.apple.dt.XCBuild IgnoreFileSystemDeviceInodeChanges -bool YES
    - name: Update mtime for incremental builds
      uses: chetan/git-restore-mtime-action@v2
    - name: Run ${{ inputs.command }}
      shell: bash
      run: |
        cd "${{ inputs.working-directory }}"
        make ${{ inputs.command }} \
          -f "$GITHUB_ACTION_PATH"/Makefile \
          WORKSPACE="${{ inputs.workspace }}"
          COMMAND="${{ inputs.subcommand }}" \
          SCHEME="${{ inputs.scheme }}" \
          PLATFORM="${{ inputs.platform }}" \
          CONFIG="${{ inputs.config }}" \
          BEAUTIFY="${{ inputs.beautify }}" \"
    - name: Commit swift-format
      if: input.command == 'swift-format'
      uses: stefanzweifel/git-auto-commit-action@v5
      with:
        commit_message: "[swift-format]"
        branch: 'main'
