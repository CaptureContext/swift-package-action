name: 'swift-package-cache-derived-data'
description: 'Cache DerivedData'
author: 'capturecontext'

branding:
  icon: 'archive'
  color: 'gray-dark'

inputs:
  path:
    description: "Base path for DerivedData caching"
    required: false
    default: ~/.derivedData
  prefix:
    description: "Custom prefix for caching key"
    required: false
    default: __unspecified__
  xcode:
    description: Xcode version key
    required: false
    default: '26.2'
  platform:
    description: "Platform key"
    required: false
    default: __unspecified__
  command:
    description: "Command key"
    required: false
    default: __unspecified__
  suffix:
    description: "Suffix for caching key, likely to be files hash"
    required: false
    default: __unspecified__

outputs:
  resolved-base-key:
    description: 'Resolved base key'
    value: ${{ steps.cache-derived-data.outputs.resolved-base-key }}
  resolved-suffix:
    description: 'Resolved suffix'
    value: ${{ steps.cache-derived-data.outputs.resolved-suffix }}
  resolved-key:
    description: 'Resolved base key followed by resolved suffix'
    value: ${{ steps.cache-derived-data.outputs.resolved-key }}
  resolved-restore-keys:
    description: 'Resolved base key'
    value: ${{ steps.cache-derived-data.outputs.resolved-restore-keys }}
  derived-data-path:
    description: 'Path to DerivedData used for caching'
    value: ${{ inputs.path }}
  cache-hit:
    description: 'A boolean value to indicate an exact match was found for the primary key'
    value: ${{ steps.cache-derived-data.outputs.cache-hit }}

runs:
  using: 'composite'
  steps:
    - id: print-action-path
      name: Print GITHUB_ACTION_PATH
      uses: capturecontext/swift-package-action/print-action@main
      with:
        name: "swift-package-cache-derived-data"

    - id: cache-derived-data
      name: Cache DerivedData
      uses: capturecontext/swift-package-action/cache@main
      with:
        path: ${{ inputs.path }}
        prefix: ${{ inputs.prefix }}
        arg1: ${{ inputs.platform }}
        arg2: xcode
        arg3: ${{ inputs.xcode }}
        arg4: ${{ inputs.command }}
        suffix: ${{ inputs.suffix }}
