name: 'swift-package-cache-restore'
description: 'Restore Cache artifacts like dependencies and build outputs to improve workflow execution time'
author: 'capturecontext'

branding:
  icon: 'archive'
  color: 'gray-dark'

inputs:

  # mark: - passthrough args

  path:
    description: 'A list of files, directories, and wildcard patterns to restore'
    required: true
  enable-cross-os-archive:
    description: 'An optional boolean when enabled, allows windows runners to restore caches that were saved on other platforms'
    default: 'false'
    required: false
  fail-on-cache-miss:
    description: 'Fail the workflow if cache entry is not found'
    default: 'false'
    required: false
  lookup-only:
    description: 'Check if a cache entry exists for the given input(s) (key, restore-keys) without downloading the cache'
    default: 'false'
    required: false

  # mark: - key-related args

  prefix:
    description: 'Prefix for caching key'
    default: cache
    required: false
  arg1:
    description: First argument
    default: __unspecified__
    required: false
  arg2:
    description: Second argument
    default: __unspecified__
    required: false
  arg3:
    description: Third argument
    default: __unspecified__
    required: false
  arg4:
    description: Fourth argument
    default: __unspecified__
    required: false
  arg5:
    description: Fifth argument
    default: __unspecified__
    required: false
  suffix:
    description: 'Suffix for caching key, likely to be files hash'
    default: __unspecified__
    required: false

outputs:
  resolved-base-key:
    description: 'Resolved base key'
    value: ${{ steps.resolve-cache-keys.outputs.resolved-base-key }}
  resolved-suffix:
    description: 'Resolved suffix'
    value: ${{ steps.resolve-cache-keys.outputs.resolved-suffix }}
  resolved-key:
    description: 'Resolved base key followed by resolved suffix'
    value: ${{ steps.resolve-cache-keys.outputs.resolved-key }}
  resolved-restore-keys:
    description: 'Resolved base key'
    value: ${{ steps.resolve-cache-keys.outputs.resolved-restore-keys }}
  cache-hit:
    description: 'A boolean value to indicate an exact match was found for the primary key'
    value: ${{ steps.restore-step.outputs.cache-hit }}
  cache-primary-key:
    description: 'A resolved cache key for which cache match was attempted'
    value: ${{ steps.restore-step.outputs.cache-primary-key }}
  cache-matched-key:
    description: 'Key of the cache that was restored, it could either be the primary key on cache-hit or a partial/complete match of one of the restore keys'
    value: ${{ steps.restore-step.outputs.cache-matched-key }}

runs:
  using: 'composite'
  steps:
    - id: resolve-cache-keys
      name: Resolve cache keys
      uses: capturecontext/swift-package-action/cache/resolve-keys@main
      with:
        prefix: ${{ inputs.prefix }}
        arg1: ${{ inputs.arg1 }}
        arg2: ${{ inputs.arg2 }}
        arg3: ${{ inputs.arg3 }}
        arg4: ${{ inputs.arg4 }}
        arg5: ${{ inputs.arg5 }}
        suffix: ${{ inputs.suffix }}

    - name: Save ${{ inputs.prefix }}
      id: restore-step
      uses: actions/cache/restore@v5
      with:
        path: ${{ inputs.path }}
        enableCrossOsArchive: ${{ inputs.enable-cross-os-archive }}
        fail-on-cache-miss: ${{ inputs.fail-on-cache-miss }}
        lookup-only: ${{ inputs.lookup-only }}
        key: ${{ steps.resolve-cache-keys.outputs.resolved-key }}
        restore-keys: ${{ steps.resolve-cache-keys.outputs.resolved-restore-keys }}
