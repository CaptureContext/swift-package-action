name: 'swift-package-cache-resolve-keys'
description: 'Resolve cache keys for swift packages'
author: 'capturecontext'

branding:
  icon: 'archive'
  color: 'gray-dark'

inputs:
  prefix:
    description: 'Prefix for caching key'
    default: cache
    required: false
  arg1:
    description: First argument
    default: __unspecified__
    required: false
  arg2:
    description: Second argument
    default: __unspecified__
    required: false
  arg3:
    description: Third argument
    default: __unspecified__
    required: false
  arg4:
    description: Fourth argument
    default: __unspecified__
    required: false
  arg5:
    description: Fifth argument
    default: __unspecified__
    required: false
  suffix:
    description: 'Suffix for caching key, likely to be files hash'
    default: __unspecified__
    required: false

outputs:
  resolved-base-key:
    description: 'Resolved base key'
    value: ${{ steps.resolve-base-key.outputs.value }}
  resolved-suffix:
    description: 'Resolved suffix'
    value: ${{ steps.resolve-suffix.outputs.value }}
  resolved-key:
    description: 'Resolved base key followed by resolved suffix'
    value: ${{ steps.resolve-cache-key.outputs.value }}
  resolved-restore-keys:
    description: 'Resolved base key'
    value: ${{ steps.resolve-restore-keys.outputs.value }}

runs:
  using: 'composite'
  steps:
    - id: print-action-path
      name: Print GITHUB_ACTION_PATH
      uses: capturecontext/swift-package-action/print-action-path@main
      with:
        name: "swift-package-cache-resolve-keys"
        path: ${{ env.GITHUB_ACTION_PATH }}

    - id: resolve-base-key
      name: Resolve base cache key
      shell: bash
      run: |
        # resolve-base-key step

        BASE_KEY=""
        [[ "${{ inputs.prefix }}" != "__unspecified__" ]] && BASE_KEY="${{ inputs.prefix }}"
        [[ "${{ inputs.arg1 }}" != "__unspecified__" ]] && BASE_KEY="${BASE_KEY}-${{ inputs.arg1 }}"
        [[ "${{ inputs.arg2 }}" != "__unspecified__" ]] && BASE_KEY="${BASE_KEY}-${{ inputs.arg2 }}"
        [[ "${{ inputs.arg3 }}" != "__unspecified__" ]] && BASE_KEY="${BASE_KEY}-${{ inputs.arg3 }}"
        [[ "${{ inputs.arg4 }}" != "__unspecified__" ]] && BASE_KEY="${BASE_KEY}-${{ inputs.arg4 }}"
        [[ "${{ inputs.arg5 }}" != "__unspecified__" ]] && BASE_KEY="${BASE_KEY}-${{ inputs.arg5 }}"

        # remove leading '-' if prefix is unspecified, but some args are present
        BASE_KEY="${BASE_KEY#-}"

        echo "value=${BASE_KEY}" >> "$GITHUB_OUTPUT"

        echo "resolved-base-key: ${BASE_KEY}"

    - id: resolve-suffix
      name: Resolve suffix
      shell: bash
      run: |
        # resolve-suffix step

        SUFFIX="${{ inputs.suffix }}"
        [[ "${{ inputs.suffix }}" == "__unspecified__" ]] && \
          SUFFIX="${{ hashFiles('**/Sources/**/*.swift', '**/Tests/**/*.swift') }}"
        echo "value=${SUFFIX}" >> "$GITHUB_OUTPUT"

        echo "resolved-suffix: ${SUFFIX}"

    - id: resolve-cache-key
      name: Resolve cache key
      shell: bash
      run: |
        # resolve-cache-key step

        BASE_KEY="${{ steps.resolve-base-key.outputs.value }}"
        SUFFIX="${{ steps.resolve-suffix.outputs.value }}"
        RESOLVED_KEY="${BASE_KEY}-${SUFFIX}"

        # remove leading '-' if base key is empty
        RESOLVED_KEY="${RESOLVED_KEY#-}" 

        echo "value=${RESOLVED_KEY}" >> "$GITHUB_OUTPUT"

        echo "resolved-cache-key: ${RESOLVED_KEY}"

    - id: resolve-restore-keys
      name: Resolve restore keys
      shell: bash
      run: |
        # resolve-restore-keys step

        RESOLVED_RESTORE_KEYS="${{ steps.resolve-base-key.outputs.value }}"
        echo "value=${RESOLVED_RESTORE_KEYS}" >> "$GITHUB_OUTPUT"

        echo "resolved-restore-keys: ${RESOLVED_RESTORE_KEYS}"
