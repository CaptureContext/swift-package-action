name: 'swift-package-cache-save'
description: 'Save Cache artifacts like dependencies and build outputs to improve workflow execution time'
author: 'capturecontext'

branding:
  icon: 'archive'
  color: 'gray-dark'

inputs:

  # mark: - passthrough args

  path:
    description: 'A list of files, directories, and wildcard patterns to cache'
    required: true
  upload-chunk-size:
    description: 'The chunk size used to split up large files during upload, in bytes'
    required: false
  enable-cross-os-archive:
    description: 'An optional boolean when enabled, allows windows runners to save caches that can be restored on other platforms'
    default: 'false'
    required: false

  # mark: - key-related args

  prefix:
    description: 'Prefix for caching key'
    default: cache
    required: false
  arg1:
    description: First argument
    default: __unspecified__
    required: false
  arg2:
    description: Second argument
    default: __unspecified__
    required: false
  arg3:
    description: Third argument
    default: __unspecified__
    required: false
  arg4:
    description: Fourth argument
    default: __unspecified__
    required: false
  arg5:
    description: Fifth argument
    default: __unspecified__
    required: false
  suffix:
    description: 'Suffix for caching key, likely to be files hash'
    default: __unspecified__
    required: false

outputs:
  resolved-base-key:
    description: 'Resolved base key'
    value: ${{ steps.resolve-cache-keys.outputs.resolved-base-key }}
  resolved-suffix:
    description: 'Resolved suffix'
    value: ${{ steps.resolve-cache-keys.outputs.resolved-suffix }}
  resolved-key:
    description: 'Resolved base key followed by resolved suffix'
    value: ${{ steps.resolve-cache-keys.outputs.resolved-key }}
  resolved-restore-keys:
    description: 'Resolved base key'
    value: ${{ steps.resolve-cache-keys.outputs.resolved-restore-keys }}

runs:
  using: 'composite'
  steps:
    - id: print-action-path
      name: Print GITHUB_ACTION_PATH
      uses: capturecontext/swift-package-action/print-action-path@main
      with:
        name: "swift-package-cache-save"
        path: ${{ env.GITHUB_ACTION_PATH }}

    - id: resolve-cache-keys
      name: Resolve cache keys
      uses: capturecontext/swift-package-action/cache/resolve-keys@main
      with:
        prefix: ${{ inputs.prefix }}
        arg1: ${{ inputs.arg1 }}
        arg2: ${{ inputs.arg2 }}
        arg3: ${{ inputs.arg3 }}
        arg4: ${{ inputs.arg4 }}
        arg5: ${{ inputs.arg5 }}
        suffix: ${{ inputs.suffix }}

    - name: Save ${{ inputs.prefix }}
      uses: actions/cache/save@v5
      with:
        path: ${{ inputs.path }}
        upload-chunk-size: ${{ inputs.upload-chunk-size }}
        enableCrossOsArchive: ${{ inputs.enable-cross-os-archive }}
        key: ${{ steps.resolve-cache-keys.outputs.resolved-key }}
