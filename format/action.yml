name: 'swift-package-format'
description: "Format source code"
author: 'capturecontext'

branding:
  icon: 'package'
  color: 'gray-dark'

inputs:
  xcode:
    description: Xcode version
    required: false
    default: '26.2'
  formatter:
    description: "Formatter"
    required: false
    default: swift-format
  config:
    description: "Path to custom config"
    required: false
    default: __unspecified__
  commit-message:
    description: "Commit message for the action"
    required: false
    default: "[format]"
  branch:
    description: "Branch for committing result of the action"
    required: false
    default: main
  working-directory:
    description: "Where to run the action"
    required: false
    default: '.'

runs:
  using: "composite"
  steps:
    - id: print-action-path
      name: Print GITHUB_ACTION_PATH
      uses: capturecontext/swift-package-action/print-action@3.0-beta.13
      with:
        name: "swift-package-format"

    - id: setup-venv
      name: Setup venv
      uses: capturecontext/swift-package-action/setup-venv@3.0-beta.13

    - id: select-xcode
      name: Select Xcode ${{ inputs.xcode }}
      uses: capturecontext/swift-package-action/xcode-select@3.0-beta.13
      with:
        version: ${{ inputs.xcode }}

    - id: perform-formatting
      name: Perform formatting
      shell: bash
      run: |
        # perform-formatting step

        cd "${{ inputs.working-directory }}"
        make format \
          -f "$GITHUB_ACTION_PATH"/Makefile \
          FORMATTER="${{ inputs.formatter }}"
          CONFIG="${{ inputs.config }}"

    - id: commit-formatting
      name: Commit formatting
      uses: stefanzweifel/git-auto-commit-action@v5
      with:
        commit_message: ${{ inputs.commit-message }}
        branch: ${{ inputs.branch }}
