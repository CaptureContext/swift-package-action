name: 'swift-package-setup-venv'
description: 'Create python virtual environment for running actions'
author: 'capturecontext'

branding:
  icon: 'archive'
  color: 'gray-dark'

inputs:
  working-directory:
    description: "Where to run the action"
    required: false
    default: '.'

runs:
  using: 'composite'
  steps:
  - name: Install Python
    uses: actions/setup-python@v5
    with:
      python-version: '3.13'
  - name: Create .venv
    shell: bash
    run: |
      echo "setup-venv GITHUB_ACTION_PATH: $GITHUB_ACTION_PATH"
      cd "${{ inputs.working-directory }}"
      make venv \
        -f "$GITHUB_ACTION_PATH"/Makefile
